name: Repository Sync

on:
  schedule:
    # Sync every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      sync_force:
        description: 'Force sync even if no changes detected'
        required: false
        default: 'false'

jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Check for changes and sync status
        uses: actions/github-script@v7
        with:
          script: |
            // Get the latest commit
            const { data: commits } = await github.rest.repos.listCommits({
              owner: 'socraticstatic',
              repo: 'Cloud_Designer',
              per_page: 1
            });
            
            const latestCommit = commits[0];
            const commitAge = Date.now() - new Date(latestCommit.commit.author.date).getTime();
            const hoursOld = Math.floor(commitAge / (1000 * 60 * 60));
            
            console.log(`📋 Repository Sync Status Report`);
            console.log(`📊 Repository: socraticstatic/Cloud_Designer`);
            console.log(`🕒 Latest commit: ${latestCommit.commit.message}`);
            console.log(`👤 Author: ${latestCommit.commit.author.name}`);
            console.log(`⏰ Age: ${hoursOld} hours ago`);
            console.log(`🔗 Live site: https://socraticstatic.github.io/Cloud_Designer/`);
            
            // Check if GitHub Pages is enabled
            try {
              const { data: pages } = await github.rest.repos.getPages({
                owner: 'socraticstatic',
                repo: 'Cloud_Designer'
              });
              
              console.log(`✅ GitHub Pages Status: Active`);
              console.log(`🌐 Pages URL: ${pages.html_url}`);
              console.log(`📝 Source: ${pages.source.branch}/${pages.source.path}`);
            } catch (error) {
              console.log(`⚠️ GitHub Pages may not be enabled or configured`);
            }
            
            // Auto-trigger deployment if changes are recent and no deployment workflow ran
            if (hoursOld < 1 && context.payload.inputs?.sync_force !== 'true') {
              console.log(`🔄 Recent changes detected, checking if deployment is needed...`);
              
              const { data: deployments } = await github.rest.repos.listDeployments({
                owner: 'socraticstatic',
                repo: 'Cloud_Designer',
                environment: 'github-pages',
                per_page: 1
              });
              
              if (deployments.length === 0 || 
                  new Date(deployments[0].created_at).getTime() < new Date(latestCommit.commit.author.date).getTime()) {
                console.log(`🚀 Triggering auto-deployment...`);
                
                await github.rest.actions.createWorkflowDispatch({
                  owner: 'socraticstatic',
                  repo: 'Cloud_Designer',
                  workflow_id: 'deploy.yml',
                  ref: 'main'
                });
              } else {
                console.log(`✅ Deployment is up to date`);
              }
            }